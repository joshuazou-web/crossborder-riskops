[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossborder-riskops"
version = "1.0.0"
description = "CrossBorder RiskOps - a cross-border payment risk operations workbench with a bounded AI investigation copilot (synthetic data)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhihua Zou" }]
keywords = ["fintech", "cross-border payments", "risk operations", "human-in-the-loop", "ai guardrails", "duckdb"]

dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "streamlit>=1.36",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
riskops = "riskops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskops = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: tests that build the warehouse or train the model"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["E402"]
"app/**/*" = ["E402"]
"scripts/*" = ["E402"]
